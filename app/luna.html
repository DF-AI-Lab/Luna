<title>Luna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@200&family=Manrope:wght@500;700&display=swap">
<style>
/* Layout: a deep-space sky that shifts with the time of day. Script "Luna" wordmark + moon up top,
   one column of glass cards grouped by urgency, a floating send bar. Single dark look on purpose. */
:root {
  color-scheme: dark;
  /* sky (set per time of day by script) */
  --sky-top: #010205;
  --sky-mid: #03060f;
  --sky-low: #07101e;
  --glow: rgba(70, 110, 170, .10);
  --glow-pos: 85% -10%;
  /* UI */
  --glass: rgba(255, 255, 255, 0.04);
  --glass-hi: rgba(255, 255, 255, 0.075);
  --edge: rgba(190, 200, 255, 0.14);
  --fg: #f1f2ff;
  --muted: #a3a8c8;
  --violet: #a99bff;
  --violet-deep: #6c5ce7;
  --moon: #f4ecd2;
  --red: #ff8a80;
  --amber: #f5c26b;
  --green: #7fe0a8;
  --script: "Josefin Sans", "Segoe UI", system-ui, sans-serif;
  --ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
:root[data-sky="night"]     { --sky-top:#010205; --sky-mid:#03060f; --sky-low:#07101e; --glow:rgba(70,110,170,.10); --glow-pos:85% -10%; }
:root[data-sky="morning"]   { --sky-top:#02040a; --sky-mid:#081224; --sky-low:#18263c; --glow:rgba(255,170,120,.12); --glow-pos:50% 115%; }
:root[data-sky="afternoon"] { --sky-top:#0c1a3d; --sky-mid:#16295a; --sky-low:#2b4580; --glow:rgba(150,200,255,.18); --glow-pos:80% -5%; }
:root[data-sky="evening"]   { --sky-top:#03040c; --sky-mid:#0c1426; --sky-low:#2a2230; --glow:rgba(255,120,110,.18); --glow-pos:20% 115%; }
* { box-sizing: border-box; }
html { background: var(--sky-top); }
body {
  min-height: 100vh; margin: 0;
  background: radial-gradient(90% 60% at var(--glow-pos), var(--glow) 0%, transparent 70%),
              linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%) fixed;
  color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 140px;
  transition: background 1s;
}
#stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 34px; }

/* Header */
header { position: relative; border: 1px solid var(--edge); border-radius: 22px; overflow: hidden;
  background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 18px 132px 18px 20px; min-height: 128px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.moon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 96px; height: 96px;
  filter: drop-shadow(0 0 26px rgba(244, 236, 210, .22)); }
.wordmark { font-family: var(--script); font-weight: 200; font-size: 1.5rem; letter-spacing: .5em; text-transform: uppercase; line-height: 1; margin: 0 0 4px; color: var(--moon); }
.hello { font-family: var(--ui); font-weight: 500; font-size: 1.05rem; color: var(--fg); }
.meta { color: var(--muted); font-family: var(--ui); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.mockflag { color: var(--violet); }
.empty { color: var(--muted); text-align: center; padding: 40px 12px; margin: 0; }
.saved { color: var(--green); font-size: .9rem; text-align: center; margin: 0; }


/* Sections */
section { display: flex; flex-direction: column; gap: 14px; }
section h2 { font-family: var(--ui); font-weight: 700; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase;
  color: var(--muted); margin: 0; display: flex; align-items: center; gap: 10px; }
section h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.red .dot { background: var(--red); box-shadow: 0 0 12px var(--red); }
.amber .dot { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.green .dot { background: var(--green); box-shadow: 0 0 12px var(--green); }

/* Cards */
.card {
  background: linear-gradient(160deg, var(--glass-hi), var(--glass));
  border: 1px solid var(--edge); border-radius: 20px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.card h3 { margin: 0; font-family: var(--ui); font-weight: 700; font-size: 1.12rem; line-height: 1.3; }
.when { font-family: var(--ui); font-size: .88rem; color: var(--violet); font-variant-numeric: tabular-nums; margin-top: -8px; }
.card ul { margin: 0; padding-left: 20px; color: var(--muted); }
.card li + li { margin-top: 2px; }
.plan { border-radius: 12px; padding: 11px 14px; font-size: .95rem; background: rgba(169, 155, 255, .09); border: 1px solid rgba(169, 155, 255, .16); }
.plan b { font-family: var(--ui); color: var(--violet); }

.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button { font: 700 .95rem var(--ui); cursor: pointer; border-radius: 12px; padding: 11px 10px;
  border: 1px solid var(--edge); background: rgba(255, 255, 255, .03); color: var(--fg); transition: background .15s, border-color .15s; }
button:hover { background: rgba(255, 255, 255, .08); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
button.on { background: linear-gradient(135deg, var(--violet), var(--violet-deep)); border-color: transparent; color: #fff; }
textarea { width: 100%; min-height: 46px; resize: vertical; font: inherit; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--edge); background: rgba(3, 4, 14, .4); color: var(--fg); }
textarea::placeholder { color: #767b9e; }
.status { font-family: var(--ui); font-size: .85rem; font-weight: 700; color: var(--green); }
.card.answered { opacity: .55; }
.card.answered .plan, .card.answered ul { display: none; }

/* Send bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar .in { max-width: 580px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(8, 10, 28, .85); border: 1px solid var(--edge); border-radius: 18px; padding: 10px 10px 10px 18px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); }
#count { font-family: var(--ui); font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar button.send { background: linear-gradient(135deg, var(--violet), var(--violet-deep)); color: #fff; border-color: transparent; padding: 11px 20px; }
.bar button:disabled { opacity: .4; cursor: default; }

pre { background: rgba(3, 4, 14, .55); border: 1px solid var(--edge); border-radius: 16px; padding: 16px; overflow-x: auto; font-size: .8rem; color: var(--muted); }
.sign { text-align: center; color: var(--muted); font-family: var(--ui); font-size: .95rem; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .5s ease both; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
.card.dusting { animation: dustFade .7s ease-out forwards; pointer-events: none; }
@keyframes dustFade { to { opacity: 0; filter: blur(8px); transform: scale(1.03); } }
.slot { transition: height .35s ease; overflow: hidden; }
.gone { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--ui); font-size: .9rem; color: var(--green); font-weight: 700; padding: 8px 4px; }
.gone span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gone button { font-size: .8rem; padding: 5px 12px; border-radius: 99px; flex: none; }
@media (prefers-reduced-motion: reduce) { .card.dusting { animation-duration: .01s; } }
@media (max-width: 420px) { header { padding-right: 104px; min-height: 116px; } .moon { width: 84px; height: 84px; right: 14px; } }
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <canvas class="moon" id="moon" aria-hidden="true"></canvas>
    <h1 class="wordmark">Luna</h1>
    <div class="hello" id="hello">Good morning, Darren</div>
    <div class="meta"><span id="dateLabel"></span><span id="cardCount"></span><span id="phaseName"></span><span class="mockflag" id="flag" hidden></span></div>
  </header>


  <div id="board"><p class="empty" id="empty">Loading today's cards…</p></div>

  <pre id="out" hidden></pre>
  <p class="sign">Anything urgent later today, I'll flag it if I find it.</p>
</div>

<div class="bar"><div class="in">
  <span id="count">0 answered</span>
  <button class="send" id="send" type="button" disabled>Send replies</button>
</div></div>

<script>
// Sky: time of day
const SKY = {
  night:     { stars: 1.0, hello: 'Evening, Darren' },
  morning:   { stars: 0.75, hello: 'Good morning, Darren' },
  afternoon: { stars: 0.25, hello: 'Good afternoon, Darren' },
  evening:   { stars: 0.6, hello: 'Good evening, Darren' },
};
let starLevel = 1;
function skyFor(h) { return h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night'; }
function setSky(name) {
  document.documentElement.dataset.sky = name;
  starLevel = SKY[name].stars;
  document.getElementById('hello').textContent = SKY[name].hello;
}
// Automatic: picks the sky from the clock and re-checks every 5 minutes
setSky(skyFor(new Date().getHours()));
setInterval(() => setSky(skyFor(new Date().getHours())), 5 * 60 * 1000);

// Moving starfield: twinkle, slow drift, the odd shooting star
(function () {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, d, stars = [], shoot = null, level = starLevel;
  function build() {
    d = window.devicePixelRatio || 1;
    W = c.width = innerWidth * d; H = c.height = innerHeight * d;
    const n = Math.round(innerWidth * innerHeight / 5000);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (0.25 + Math.random() ** 3 * 1.4) * d,
      a: 0.2 + Math.random() * 0.7,
      tw: 0.4 + Math.random() * 1.6, ph: Math.random() * 6.28,
      z: 0.2 + Math.random() * 0.8,
      tint: Math.random() > 0.88 ? '#cdd6ff' : Math.random() > 0.94 ? '#ffe2c4' : '#ffffff',
    }));
  }
  function frame(t) {
    level += (starLevel - level) * 0.04;
    x.clearRect(0, 0, W, H);
    const s = t / 1000;
    for (const p of stars) {
      if (!still) { p.x -= 0.07 * p.z * d; p.y += 0.022 * p.z * d; if (p.x < -2) p.x = W + 2; if (p.y > H + 2) p.y = -2; }
      const tw = still ? 1 : 0.65 + 0.35 * Math.sin(s * p.tw + p.ph);
      x.globalAlpha = p.a * tw * level;
      x.fillStyle = p.tint;
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
    }
    if (!still) {
      if (!shoot && Math.random() < 0.0025 * level) {
        shoot = { x: Math.random() * W * 0.8 + W * 0.2, y: Math.random() * H * 0.35, life: 0 };
      }
      if (shoot) {
        shoot.life += 1;
        const k = shoot.life / 60, len = 120 * d;
        const hx = shoot.x - k * 420 * d, hy = shoot.y + k * 180 * d;
        const g = x.createLinearGradient(hx, hy, hx + len, hy - len * 0.43);
        g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.globalAlpha = Math.sin(Math.PI * k) * level;
        x.strokeStyle = g; x.lineWidth = 1.4 * d;
        x.beginPath(); x.moveTo(hx, hy); x.lineTo(hx + len, hy - len * 0.43); x.stroke();
        if (shoot.life >= 60) shoot = null;
      }
      requestAnimationFrame(frame);
    }
  }
  build(); addEventListener('resize', () => { build(); if (still) frame(0); });
  requestAnimationFrame(frame);
})();

// Moon: realistic render with the real phase for the briefing date
(function () {
  const date = new Date();
  const ref = Date.UTC(2000, 0, 6, 18, 14);        // known new moon
  const f = ((((date - ref) / 86400000) % 29.530589) + 29.530589) % 29.530589 / 29.530589;  // 0 new, .5 full
  const names = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  document.getElementById('phaseName').textContent = names[Math.round(f * 8) % 8];

  const cv = document.getElementById('moon');
  const S = Math.round(96 * Math.min(devicePixelRatio || 1, 3));
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(S, S), px = img.data;
  // seeded value noise, wraps in x so the surface map has no seam
  let seed = 42; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const G = 64, grid = Array.from({ length: G * G }, rnd);
  const sm = t => t * t * (3 - 2 * t);
  function noise(x, y, P) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const g = (a, b) => grid[((b % G + G) % G) * G + ((a % P + P) % P)];
    return (g(xi, yi) * (1 - xf) + g(xi + 1, yi) * xf) * (1 - yf) + (g(xi, yi + 1) * (1 - xf) + g(xi + 1, yi + 1) * xf) * yf;
  }
  const fbm = (x, y) => noise(x, y, 8) * .5 + noise(x * 2, y * 2, 16) * .25 + noise(x * 4, y * 4, 32) * .125 + noise(x * 8, y * 8, 64) * .0625;
  const unit = (x, y) => [x, y, Math.sqrt(Math.max(0, 1 - x * x - y * y))];
  // near-side maria (x right, y up on the sphere), far side mostly highlands
  const maria = [[-.38,.38,.27],[.12,.36,.17],[.3,.08,.2],[.62,.25,.12],[.5,-.15,.15],[.38,-.32,.1],[-.2,-.36,.17],[-.6,.02,.3],[-.48,-.3,.16],[-.05,.62,.28]]
    .map(([x, y, r]) => [...unit(x, y), r]);
  const craters = Array.from({ length: 150 }, () => {
    const zz = rnd() * 2 - 1, t = rnd() * 6.283, q = Math.sqrt(1 - zz * zz);
    return [q * Math.sin(t), zz, q * Math.cos(t), .015 + rnd() ** 2 * .08];
  });
  const ty = unit(-.15, -.66); craters.push([...ty, .05]);   // Tycho
  const e1 = [ty[2], 0, -ty[0]], n1 = Math.hypot(...e1); e1.forEach((v, k) => e1[k] = v / n1);
  const e2 = [ty[1] * e1[2] - ty[2] * e1[1], ty[2] * e1[0] - ty[0] * e1[2], ty[0] * e1[1] - ty[1] * e1[0]];
  // bake a surface map once (longitude x latitude), then spin it each frame
  const TW = 512, TH = 256, tex = new Float32Array(TW * TH);
  for (let v = 0; v < TH; v++) for (let u = 0; u < TW; u++) {
    const lon = (u / TW - .5) * 6.2832, lat = (.5 - (v + .5) / TH) * Math.PI;
    const X = Math.cos(lat) * Math.sin(lon), Y = Math.sin(lat), Z = Math.cos(lat) * Math.cos(lon);
    const fx = u / TW * 8, fy = v / TH * 4;
    let a = .78 + (fbm(fx + .3, fy + 3) - .5) * .25, m = 0;
    for (const [mx, my, mz, mr] of maria) {
      const d = Math.hypot(X - mx, Y - my, Z - mz) / (mr * (.8 + .5 * fbm(fx * 2 + mx * 9, fy * 2)));
      m = Math.max(m, 1 - sm(Math.min(1, Math.max(0, (d - .6) / .5))));
    }
    a -= m * .36;
    for (const [cx, cy, cz, cr] of craters) {
      const d = Math.hypot(X - cx, Y - cy, Z - cz) / cr;
      if (d < 1.1) a += d < .85 ? -.045 * (1 - m * .5) * (1 - d * .6) : .045 * (1 - Math.abs(d - .95) * 6);
    }
    const dx = X - ty[0], dy = Y - ty[1], dz = Z - ty[2], td = Math.hypot(dx, dy, dz);
    if (td > .05 && td < .9) {
      const ang = Math.atan2(dx * e2[0] + dy * e2[1] + dz * e2[2], dx * e1[0] + dy * e1[1] + dz * e1[2]);
      a += Math.max(0, Math.sin(ang * 9 + 1) ** 24) * .12 * (1 - td);
    }
    tex[v * TW + u] = a;
  }
  // light comes from the real phase, so the shadow stays true while the surface turns
  const fl = Math.min(.87, Math.max(.13, f));   // always keep a thin crescent visible
  const th = 2 * Math.PI * fl, Lx = Math.sin(th), Lz = -Math.cos(th);
  function draw(rot) {
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      const x = (i + .5) / S * 2 - 1, y = (j + .5) / S * 2 - 1, r2 = x * x + y * y;
      const o = (j * S + i) * 4;
      if (r2 > 1) { px[o + 3] = 0; continue; }
      const z = Math.sqrt(1 - r2);
      let lu = (Math.atan2(x, z) + rot) / 6.2832 + .5; lu -= Math.floor(lu);
      const lv = .5 - Math.asin(-y) / Math.PI;
      const a = tex[Math.min(TH - 1, lv * TH | 0) * TW + (lu * TW | 0) % TW];
      const ndl = x * Lx + z * Lz;
      const day = sm(Math.min(1, Math.max(0, (ndl + .04) / .14)));
      const lit = a * day * (.45 + .55 * Math.max(0, ndl)) * (.8 + .2 * z) * 1.3;
      const glow = (1 - day) * (.06 + a * .07 + .08 * (1 - z) ** 3);   // soft earthshine + rim on the dark side
      px[o]     = Math.min(255, lit * 255 + glow * 190);
      px[o + 1] = Math.min(255, lit * 247 + glow * 205);
      px[o + 2] = Math.min(255, lit * 228 + glow * 235);
      px[o + 3] = 255 * Math.min(1, (1 - Math.sqrt(r2)) * S * .5);
    }
    ctx.putImageData(img, 0, 0);
  }
  draw(0);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const t0 = performance.now(); let last = 0;
    (function spin(t) {
      if (t - last > 60) { last = t; draw((t - t0) / 1000 * 6.2832 / 90); }   // one turn every 90s
      requestAnimationFrame(spin);
    })(t0);
  }
})();

// Cards: built from the briefing Luna writes to the page's database each morning
const SECTIONS = [['do', 'red', 'Do today'], ['soon', 'amber', 'Coming up'], ['fyi', 'green', 'FYI · watch']];
let total = 0, answers = {}, briefDate = null, db = null;
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function render(brief) {
  const board = document.getElementById('board');
  board.textContent = '';
  briefDate = brief.date; answers = {};
  document.getElementById('dateLabel').textContent = brief.dateLabel || brief.date;
  const cards = Array.isArray(brief.cards) ? brief.cards : [];
  total = cards.length;
  document.getElementById('cardCount').textContent = total + (total === 1 ? ' card' : ' cards');
  for (const [key, colour, label] of SECTIONS) {
    const list = cards.filter(c => c.section === key);
    if (!list.length) continue;
    const sec = el('section', colour), h = el('h2');
    h.append(el('span', 'dot'), label); sec.appendChild(h);
    for (const c of list) {
      const card = el('article', 'card'); card.dataset.id = c.id;
      card.appendChild(el('h3', null, c.title));
      if (c.when) card.appendChild(el('div', 'when', c.when));
      if (c.lines && c.lines.length) { const ul = el('ul'); c.lines.forEach(t => ul.appendChild(el('li', null, t))); card.appendChild(ul); }
      if (c.plan) { const p = el('div', 'plan'); p.append(el('b', null, 'Luna will'), ' ' + c.plan); card.appendChild(p); }
      sec.appendChild(card); wire(card);
    }
    board.appendChild(sec);
  }
  if (!total) board.appendChild(el('p', 'empty', 'Nothing needs you today. Enjoy it.'));
  if (brief.note) board.appendChild(el('p', 'empty', brief.note));
  update();
}
function wire(card) {
  const id = card.dataset.id;
  const btns = el('div', 'btns');
  ['Done', 'Later', 'Skip'].forEach(label => {
    const b = el('button', null, label); b.type = 'button'; b.dataset.action = label.toLowerCase();
    b.onclick = () => {
      if (label === 'Done') { set(id, card, { action: 'done' }); stardust(card); return; }
      const was = b.classList.contains('on');
      btns.querySelectorAll('button').forEach(z => z.classList.remove('on'));
      if (!was) b.classList.add('on');
      set(id, card, { action: was ? '' : label.toLowerCase() });
    };
    btns.appendChild(b);
  });
  const ta = el('textarea'); ta.id = 'reply-' + id; ta.placeholder = 'Reply to this card…'; ta.setAttribute('aria-label', 'Reply to this card');
  ta.oninput = () => set(id, card, { reply: ta.value.trim() });
  const st = el('div', 'status'); st.hidden = true;
  card.append(btns, ta, st);
}
function set(id, card, patch) {
  answers[id] = Object.assign({ card: id, title: card.querySelector('h3').textContent }, answers[id], patch);
  if (!answers[id].action && !answers[id].reply) delete answers[id];
  const a = answers[id], st = card.querySelector('.status');
  card.classList.toggle('answered', !!(a && a.action));
  st.hidden = !a;
  if (a) st.textContent = [a.action && ('✓ ' + a.action), a.reply && 'reply added'].filter(Boolean).join(' · ');
  update(true);
}
function update(changed) {
  const n = Object.keys(answers).length;
  document.getElementById('count').textContent = n + ' of ' + total + ' answered';
  document.getElementById('send').disabled = n === 0 || !db;
  if (changed) document.getElementById('send').textContent = 'Send replies';
}
function restore(saved) {
  for (const [id, a] of Object.entries(saved || {})) {
    const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    if (!card) continue;
    if (a.reply) card.querySelector('textarea').value = a.reply;
    if (a.action && a.action !== 'done') card.querySelector('[data-action="' + a.action + '"]')?.classList.add('on');
    set(id, card, { action: a.action || '', reply: a.reply || '' });
  }
  const btn = document.getElementById('send');
  if (Object.keys(saved || {}).length) { btn.textContent = 'Saved ✓'; }
}
(async () => {
  const flag = document.getElementById('flag'), empty = document.getElementById('empty');
  const late = setTimeout(() => { if (empty.isConnected) empty.textContent = "Can't reach today's cards yet. Check your connection."; }, 10000);
  db = window.claude ? await window.claude.use('db') : null;
  if (!db) { clearTimeout(late); empty.textContent = 'Open Luna in Claude to see your cards.'; return; }
  let first = true;
  db.doc('briefing/today').onSnapshot(async snap => {
    if (!snap.metadata.fromCache) clearTimeout(late);
    if (!snap.exists) { if (!snap.metadata.fromCache) document.getElementById('board').replaceChildren(el('p', 'empty', 'No briefing yet. Luna fills this in at 8am.')); return; }
    const brief = snap.data();
    if (!first && brief.date === briefDate && brief.builtAt === render.builtAt) return;
    first = false; render.builtAt = brief.builtAt;
    render(brief);
    if (brief.test) { flag.hidden = false; flag.textContent = 'Test run'; } else flag.hidden = true;
    try { const r = await db.doc('replies/' + brief.date).get(); if (r.exists) restore(r.data().answers); } catch (e) {}
  }, () => { clearTimeout(late); document.getElementById('board').replaceChildren(el('p', 'empty', "Couldn't load today's cards. Try again later.")); });
})();
// Stardust: card breaks into glitter and the gap closes
const fx = document.getElementById('fx'), fc = fx.getContext('2d');
let parts = [], running = false;
function sizeFx() { const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; fc.setTransform(d, 0, 0, d, 0, 0); }
sizeFx(); addEventListener('resize', sizeFx);
function stardust(card) {
  const r = card.getBoundingClientRect();
  for (let i = 0; i < 180; i++) parts.push({ x: r.left + Math.random() * r.width, y: r.top + Math.random() * r.height,
    vx: (Math.random() - .3) * 1.6, vy: -Math.random() * 2.2 - .3, life: 0, max: 50 + Math.random() * 50,
    s: .6 + Math.random() * 1.8, c: Math.random() > .5 ? '#cfc6ff' : '#fff6dc' });
  if (!running) { running = true; requestAnimationFrame(tick); }
  const slot = document.createElement('div'); slot.className = 'slot';
  card.before(slot); slot.appendChild(card);
  slot.style.height = slot.offsetHeight + 'px';
  card.classList.add('dusting');
  setTimeout(() => {
    const g = document.createElement('div'); g.className = 'gone';
    g.innerHTML = '<span></span><button type="button">Undo</button>';
    g.querySelector('span').textContent = '✓ ' + card.querySelector('h3').textContent;
    card.hidden = true; card.classList.remove('dusting'); slot.appendChild(g);
    slot.style.height = g.offsetHeight + 'px';
    g.querySelector('button').onclick = () => {
      card.hidden = false; g.remove(); slot.style.height = card.offsetHeight + 'px';
      card.querySelectorAll('.btns button').forEach(z => z.classList.remove('on'));
      set(card.dataset.id, card, { action: '' });
      setTimeout(() => { slot.replaceWith(card); }, 360);
    };
  }, 700);
}
function tick() {
  fc.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life < p.max);
  for (const p of parts) {
    p.life++; const k = p.life / p.max;
    p.x += p.vx; p.y += p.vy; p.vy -= .02;
    fc.globalAlpha = (1 - k) * (.6 + .4 * Math.sin(p.life * .5));
    fc.fillStyle = p.c; fc.beginPath(); fc.arc(p.x, p.y, p.s, 0, 6.283); fc.fill();
  }
  if (parts.length) requestAnimationFrame(tick); else { running = false; fc.clearRect(0, 0, innerWidth, innerHeight); }
}

document.getElementById('send').onclick = async () => {
  const btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await db.doc('replies/' + briefDate).set({ date: briefDate, sentAt: new Date().toISOString(), answers: JSON.parse(JSON.stringify(answers)) });
    btn.textContent = 'Saved ✓';
    const out = document.getElementById('out'); out.hidden = false;
    out.textContent = 'Saved. Luna acts on these at the next run.';
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Try again';
    const out = document.getElementById('out'); out.hidden = false;
    out.textContent = e && e.code === 'invalid_argument' ? 'Only Darren can save replies on this page.' : "Couldn't save. Check your connection and try again.";
  }
};
