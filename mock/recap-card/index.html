<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridge and Money Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@200&family=Manrope:wght@500;700&display=swap">
<style>
:root {
  --sky-top: #010205; --sky-mid: #03060f; --sky-low: #0b0d24;
  --edge: rgba(190,200,255,.14);
  --fg: #f1f2ff; --muted: #a3a8c8; --faint: #7d82a6;
  --violet: #a99bff; --moon: #f4ecd2; --green: #7fe0a8; --amber: #ffc978; --red: #ff8f8f; --blue: #8fb8ff;
  --script: "Josefin Sans","Segoe UI",system-ui,sans-serif;
  --ui: "Manrope","Segoe UI",system-ui,sans-serif;
  --body: "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--sky-top); }
body { margin: 0; min-height: 100vh; color: var(--fg); font: 16px/1.5 var(--body);
  background: radial-gradient(90% 40% at 80% -5%, rgba(140,120,255,.13), transparent 70%), linear-gradient(180deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-low)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
svg { display: block; }
.wrap { max-width: 420px; margin: 0 auto; padding: 28px 16px 60px; }
.intro h1 { font: 200 1.4rem/1 var(--script); letter-spacing: .45em; text-transform: uppercase; color: var(--moon); margin: 0 0 10px; }
.intro p { margin: 0; color: var(--muted); font-size: .9rem; }

.card { margin-top: 22px; border-radius: 26px; border: 1px solid var(--edge); background: rgba(255,255,255,.045); padding: 18px 16px; }
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ico { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: rgba(169,155,255,.12); border: 1px solid rgba(169,155,255,.25); color: var(--violet); flex: none; }
.ico svg { width: 18px; height: 18px; }
.head h2 { flex: 1; font: 700 1.1rem/1.2 var(--ui); margin: 0; }
.head h2 small { display: block; font: 500 .75rem var(--ui); color: var(--faint); }
.count { font: 700 .75rem var(--ui); color: var(--red); background: rgba(255,143,143,.12); padding: 3px 9px; border-radius: 99px; }

.msg { color: var(--muted); font-size: .88rem; padding: 6px 2px; }
.msg.err { color: var(--amber); }

/* fridge rows */
.item { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; margin-bottom: 8px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--edge); transition: opacity .35s, transform .35s; }
.item.gone { opacity: 0; transform: translateX(20px); }
.item.busy { opacity: .5; pointer-events: none; }
.item .t { flex: 1; min-width: 0; }
.item .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .d { font: 700 .74rem var(--ui); }
.d.r { color: var(--red); } .d.a { color: var(--amber); }
.acts { display: flex; gap: 6px; flex: none; }
.acts button { font: 700 .75rem var(--ui); padding: 7px 11px; border-radius: 99px; border: 1px solid var(--edge); }
.acts .u { color: var(--green); border-color: rgba(127,224,168,.35); background: rgba(127,224,168,.08); }
.acts .w { color: var(--red); border-color: rgba(255,143,143,.3); background: rgba(255,143,143,.06); }
.more { display: block; width: 100%; margin-top: 4px; padding: 10px; border-radius: 14px; border: 1px dashed rgba(169,155,255,.35); color: var(--violet); font: 700 .85rem var(--ui); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); font: 700 .82rem var(--ui); padding: 9px 16px; border-radius: 99px; background: rgba(8,10,28,.95); border: 1px solid var(--edge); white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; }

/* money */
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--edge); }
.row .t { flex: 1; min-width: 0; }
.row small { display: block; color: var(--faint); font-size: .76rem; }
.amt { font: 700 .95rem var(--ui); white-space: nowrap; }
.spare { text-align: center; padding: 16px 12px; margin-top: 12px; border-radius: 18px;
  background: linear-gradient(135deg, rgba(127,224,168,.16), rgba(127,224,168,.04)); border: 1px solid rgba(127,224,168,.3); }
.spare span { display: block; font: 700 .7rem var(--ui); letter-spacing: .18em; color: var(--green); }
.spare b { display: block; font: 700 2.2rem/1.15 var(--ui); margin: 4px 0 2px; }
.spare small { color: var(--muted); font-size: .82rem; }
.pots { display: flex; gap: 8px; margin-top: 10px; }
.pot { flex: 1; padding: 9px 11px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.03); font-size: .8rem; color: var(--muted); }
.pot b { display: block; font: 700 .9rem var(--ui); color: var(--fg); }
.pot.out b { color: var(--red); }
.note { margin-top: 18px; font-size: .78rem; color: var(--faint); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>Recap</h1>
    <p>Fridge on top, money below.</p>
  </div>

  <section class="card" aria-labelledby="fh">
    <div class="head">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M6 10h12M9 5v2M9 13v3"/></svg></div>
      <h2 id="fh">Use these first<small>Fridge tracker</small></h2>
      <span class="count" id="fcount" hidden></span>
    </div>
    <div id="fridge"><p class="msg">Loading your fridge…</p></div>
  </section>

  <section class="card" aria-labelledby="mh">
    <div class="head">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg></div>
      <h2 id="mh">Money<small>Where's My Money</small></h2>
    </div>
    <div id="money"><p class="msg">Loading your money…</p></div>
  </section>

  <p class="note">Used = eaten. Bin = thrown away. It updates your fridge tracker.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const FT = "FT MCP";
const WMM = "Where's My Money";
const SHOW = 5;
let mcp = null, items = [], open = false;

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function toast(t) { const x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => x.classList.remove('on'), 1800); }

function errText(e, server) {
  const c = e && e.code;
  if (c === 'needs_reauth') return 'Reconnect ' + server + ' in claude.ai Settings → Connectors.';
  if (c === 'server_not_connected' || c === 'selection_required') return 'Add ' + server + ' in claude.ai Settings → Connectors.';
  if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'This page needs your OK to use ' + server + '.';
  if (c === 'server_unavailable') return server + ' is not answering. Try again in a bit.';
  return 'Could not reach ' + server + '.';
}

function payloadOf(r) {
  if (r && r.payload != null) return r.payload;
  const b = r && r.content && r.content.find(x => x.type === 'text');
  return b ? b.text : null;
}

/* ---------- fridge ---------- */
function dayLabel(n) {
  if (n < 0) return [n === -1 ? 'Out of date yesterday' : 'Out of date ' + (-n) + ' days', 'r'];
  if (n === 0) return ['Today', 'r'];
  if (n === 1) return ['Tomorrow', 'a'];
  return [n + ' days left', 'a'];
}
// soonest-to-go-off first (today, tomorrow…), then the oldest past-date ones
function order(list) {
  const fresh = list.filter(i => i.daysLeft >= 0).sort((a, b) => a.daysLeft - b.daysLeft);
  const past = list.filter(i => i.daysLeft < 0).sort((a, b) => b.daysLeft - a.daysLeft);
  return fresh.concat(past);
}

function renderFridge() {
  const box = $('fridge'); box.textContent = '';
  const c = $('fcount');
  if (!items.length) { c.hidden = true; box.append(el('p', 'msg', 'Nothing going off. Nice one.')); return; }
  c.hidden = false; c.textContent = items.length;
  const list = open ? items : items.slice(0, SHOW);
  for (const it of list) {
    const row = el('div', 'item'); row.dataset.id = it.id;
    const t = el('div', 't');
    t.append(el('div', 'n', it.name));
    const [lab, cls] = dayLabel(it.daysLeft);
    t.append(el('div', 'd ' + cls, lab));
    const acts = el('div', 'acts');
    const u = el('button', 'u', 'Used'); u.type = 'button'; u.setAttribute('aria-label', 'Used ' + it.name);
    const w = el('button', 'w', 'Bin'); w.type = 'button'; w.setAttribute('aria-label', 'Binned ' + it.name);
    u.onclick = () => mark(it, 'used', row);
    w.onclick = () => mark(it, 'thrown', row);
    acts.append(u, w);
    row.append(t, acts);
    box.append(row);
  }
  if (items.length > SHOW) {
    const m = el('button', 'more', open ? 'Show less ▴' : 'Show all ' + items.length + ' ▾');
    m.type = 'button'; m.setAttribute('aria-expanded', String(open));
    m.onclick = () => { open = !open; renderFridge(); };
    box.append(m);
  }
}

async function mark(it, action, row) {
  row.classList.add('busy');
  try {
    await mcp.callTool(FT, 'mark_food', { id: it.id, action });
    row.classList.add('gone');
    toast((action === 'used' ? '✓ Used: ' : '🗑 Binned: ') + it.name);
    setTimeout(() => { items = items.filter(x => x.id !== it.id); renderFridge(); }, 350);
    mcp.invalidate(FT, 'use_soon').catch(() => {});
  } catch (e) {
    row.classList.remove('busy');
    toast(e && e.code === 'tool_error' ? 'Fridge tracker said no: ' + (e.message || '').slice(0, 40) : errText(e, 'the fridge tracker'));
  }
}

function startFridge() {
  mcp.watchTool(FT, 'use_soon', { days: 3 }, ev => {
    if (ev.type === 'data') {
      let p = payloadOf(ev.result);
      if (typeof p === 'string') { try { p = JSON.parse(p); } catch (_) { p = null; } }
      if (!p || !Array.isArray(p.items)) { $('fridge').innerHTML = ''; $('fridge').append(el('p', 'msg err', 'The fridge tracker sent something odd.')); return; }
      items = order(p.items);
      renderFridge();
    } else {
      const c = ev.error && ev.error.code;
      const deny = ['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'not_granted', 'consent_required'];
      if (items.length && !deny.includes(c)) return; // keep last good list
      items = []; $('fcount').hidden = true;
      const box = $('fridge'); box.textContent = '';
      box.append(el('p', 'msg err', errText(ev.error, 'the fridge tracker')));
      if (c === 'approval_required') {
        const b = el('button', 'more', 'Allow fridge tracker'); b.type = 'button';
        b.onclick = async () => { try { await mcp.callTool(FT, 'use_soon', { days: 3 }); mcp.invalidate(FT, 'use_soon').catch(() => {}); } catch (e) { toast(errText(e, 'the fridge tracker')); } };
        box.append(b);
      }
    }
  }, { refetchInterval: 120000 });
}

/* ---------- money ---------- */
function parseMoney(text) {
  const num = re => { const m = text.match(re); return m ? m[1] : null; };
  const out = {
    spare: num(/Spare cash left:\s*£([\d,.\-]+)/i),
    toCome: num(/Still to come out:\s*£([\d,.\-]+)/i),
    bills: [], pots: []
  };
  const billRe = /^-\s*(.+?):\s*£([\d,.]+),\s*day\s*([^,]+),\s*not paid yet/gim;
  let m;
  while ((m = billRe.exec(text))) { if (parseFloat(m[2]) > 0) out.bills.push({ name: m[1], amt: m[2], day: m[3].trim() }); }
  const potRe = /^-\s*(.+?):\s*£([\d,.]+)\s*used of\s*£([\d,.]+)/gim;
  while ((m = potRe.exec(text))) out.pots.push({ name: m[1], used: parseFloat(m[2]), of: parseFloat(m[3]) });
  return out;
}
function ord(d) { const n = parseInt(d, 10); if (isNaN(n)) return d; const s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th'); return 'the ' + n + s; }

function renderMoney(m) {
  const box = $('money'); box.textContent = '';
  if (m.spare == null) { box.append(el('p', 'msg err', "Couldn't read the money summary.")); return; }
  if (m.bills.length) {
    for (const b of m.bills) {
      const r = el('div', 'row'); const t = el('div', 't', b.name);
      t.append(el('small', null, 'Due ' + ord(b.day)));
      r.append(t, el('span', 'amt', '£' + b.amt));
      box.append(r);
    }
  } else box.append(el('p', 'msg', 'No more bills to come out. 🎉'));
  const s = el('div', 'spare');
  s.append(el('span', null, 'SPARE CASH'), el('b', null, '£' + m.spare), el('small', null, 'after bills, till payday'));
  box.append(s);
  if (m.pots.length) {
    const p = el('div', 'pots');
    for (const pot of m.pots) {
      const left = pot.of - pot.used;
      const d = el('div', 'pot' + (left <= 0 ? ' out' : ''), pot.name);
      d.append(el('b', null, left <= 0 ? 'All used' : '£' + left.toFixed(0) + ' left'));
      p.append(d);
    }
    box.append(p);
  }
}

function startMoney() {
  let shown = false;
  mcp.watchTool(WMM, 'money_summary', null, ev => {
    if (ev.type === 'data') {
      const p = payloadOf(ev.result);
      renderMoney(parseMoney(typeof p === 'string' ? p : JSON.stringify(p || '')));
      shown = true;
    } else {
      const c = ev.error && ev.error.code;
      if (shown && ['server_unavailable', 'upstream_error', 'rate_limited'].includes(c)) return;
      const box = $('money'); box.textContent = '';
      box.append(el('p', 'msg err', errText(ev.error, "Where's My Money")));
      if (c === 'approval_required') {
        const b = el('button', 'more', "Allow Where's My Money"); b.type = 'button';
        b.onclick = async () => { try { const r = await mcp.callTool(WMM, 'money_summary'); const p = payloadOf(r); renderMoney(parseMoney(typeof p === 'string' ? p : '')); } catch (e) { toast(errText(e, "Where's My Money")); } };
        box.append(b);
      }
    }
  }, { refetchInterval: 300000 });
}

/* ---------- start ---------- */
(async () => {
  mcp = await claude.use('mcp');
  if (!mcp) {
    $('fridge').innerHTML = ''; $('fridge').append(el('p', 'msg err', 'Open this page in Claude to see your fridge.'));
    $('money').innerHTML = ''; $('money').append(el('p', 'msg err', 'Open this page in Claude to see your money.'));
    return;
  }
  startFridge();
  startMoney();
})();
</script>
</body>
</html>
